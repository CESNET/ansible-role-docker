- name: "install prereq packages for Docker"
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: "create /etc/apt/keyrings"
  file:
    state: directory
    path: /etc/apt/keyrings
    owner: root
    group: root
    mode: '0755'

- name: "add Docker repository key"
  get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution']|lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    force: false

- name: "remove old format docker.list"
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: "add Docker repository"
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution']|lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [ "stable" ]
    state: present
  register: docker_repo

- name: "update apt cache"
  apt:
    update_cache: yes
  when: docker_repo.changed

- name: "install docker packages"
  apt:
    state: present
    name: "{{ item }}"
  loop: "{{ docker_packages }}"

- name: "hold docker packages from upgrading"
  when: docker_packages_hold
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_packages }}"

- name: "install python-docker"
  apt:
    name:
      - python3-docker
      - pass
    state: present

- name: "change /etc/docker/daemon.json"
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
  register: daemon_json

- name: "restart Docker after changing daemon.json"
  when: daemon_json.changed
  ansible.builtin.service:
    name: docker
    state: restarted

- name: "Portainer app for easy maintenance of Docker"
  when: docker_portainer_install
  block:
    # install Portainer web app for managing containers
    - name: "create volume for portainer"
      community.docker.docker_volume:
        volume_name: portainer_data

    - name: "check that portainer admin password, certificate and private key are defined"
      assert:
        that:
          - docker_portainer_admin_password is defined
          - docker_portainer_fullchain_file is defined
          - docker_portainer_privkey_file is defined

    - name: "list normal portainer volumes"
      set_fact:
        portainer_mounts:
          - { type: bind, source: /var/run/docker.sock, target: /var/run/docker.sock }
          - { type: volume, source: portainer_data, target: /data }
          - { type: bind, source: "{{ docker_portainer_fullchain_file }}", target: "{{ docker_portainer_fullchain_file }}", read_only: yes }
          - { type: bind, source: "{{ docker_portainer_privkey_file }}", target: "{{ docker_portainer_privkey_file }}", read_only: yes }
        certbot_mounts:
          - { type: bind, source: /etc/letsencrypt/live, target: /etc/letsencrypt/live, read_only: yes }
          - { type: bind, source: /etc/letsencrypt/archive, target: /etc/letsencrypt/archive, read_only: yes }

    - name: "add certbot dirs to portainer volumes"
      when: docker_portainer_use_certbot_certificates
      set_fact:
        portainer_mounts: "{{ portainer_mounts + certbot_mounts }}"

    - name: "install portainer container"
      community.docker.docker_container:
        name: portainer
        hostname: portainer
        image: "portainer/portainer-ce:{{ docker_portainer_version }}"
        pull:  yes
        restart_policy: always
        command: "-H unix:///var/run/docker.sock --http-disabled --sslcert {{ docker_portainer_fullchain_file }} --sslkey {{ docker_portainer_privkey_file }} --no-setup-token"
        published_ports:
          - 9000:9443
        default_host_ip: ''
        mounts: "{{ portainer_mounts }}"
        image_name_mismatch: recreate
        comparisons:
          '*': strict
      register: portainer_container

    - name: "put container IP into /etc/hosts"
      lineinfile:
        path: /etc/hosts
        regexp: 'portainer'
        line: "{{ portainer_container.container.NetworkSettings.Networks.bridge.IPAddress }} portainer"

    - name: "Wait for portainer API to become available"
      ansible.builtin.uri:
        url: "https://portainer:9443/api/system/status"
        validate_certs: false
        status_code: 200
        timeout: 30
      register: portainer_api_status
      until: portainer_api_status.status == 200
      retries: 15
      delay: 10

    - name: "Initialize portainer admin account via API"
      ansible.builtin.uri:
        url: "https://portainer:9443/api/users/admin/init"
        method: POST
        body_format: json
        body:
          Username: "admin"
          Password: "{{ docker_portainer_admin_password }}"
        validate_certs: false
        status_code:
          - 200
          - 409
      no_log: true  # hide password from logs

- name: "log into docker container registries"
  docker_login:
    registry_url: "{{ item.url }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
  loop: "{{ docker_registries }}"
  loop_control:
    label: "{{ item.url }}"

- name: "create a local Docker network named {{ docker_local_network_name }}"
  when: docker_local_network_create
  docker_network:
    name: "{{ docker_local_network_name }}"
    enable_ipv6: "{{ docker_local_network_ipv6 }}"
    driver: bridge
    ipam_config: "{{ docker_local_network_ipam_config }}"
    driver_options:
      com.docker.network.driver.mtu: "{{ ansible_facts['default_ipv4'].mtu }}"
  register: docker_local_network_info

- name: "create volumes"
  community.docker.docker_volume:
    volume_name: "{{ item }}"
  loop: "{{ docker_volumes }}"

- name: "cron jobs"
  cron:
    name: "{{ item.name }}"
    user: "{{ item.user|default('root') }}"
    job: "{{ item.job }}"
    hour: "{{ item.hour|default('*') }}"
    minute: "{{ item.minute|default('*') }}"
  loop: "{{ docker_cron_jobs }}"

- name: "cron jobs force"
  shell: "{{ item.job }}"
  when: docker_cron_jobs_force
  loop: "{{ docker_cron_jobs }}"

- name: "Configure unhealthy container autorestarter"
  when: docker_unhealthy_container_autorestarter is defined
  block:
    - name: Set-up user docker-unhealthy-autorestarter
      ansible.builtin.user:
        name: docker-unhealthy-autorestarter
        group: docker
        system: true
        state: "{{ 'present' if docker_unhealthy_container_autorestarter else 'absent' }}"
        shell: /usr/sbin/nologin
        create_home: false
      notify: restart docker-unhealthy-autorestarter.service

    - name: Install script docker-unhealthy-autorestarter
      ansible.builtin.copy:
        src: files/docker-unhealthy-autorestarter
        dest: /usr/local/bin/
        owner: docker-unhealthy-autorestarter
        mode: 0744
      notify: restart docker-unhealthy-autorestarter.service
      when: docker_unhealthy_container_autorestarter

    - name: Install systemd service docker-unhealthy-autorestarter.service
      ansible.builtin.copy:
        src: files/docker-unhealthy-autorestarter.service
        dest: /etc/systemd/system/
      notify: restart docker-unhealthy-autorestarter.service
      when: docker_unhealthy_container_autorestarter

- name: Set-up user docker-pruner
  ansible.builtin.user:
    name: docker-pruner
    group: docker
    system: true
    state: present
    shell: /usr/sbin/nologin
    create_home: false
  when: docker_container_prune is defined or docker_image_prune is defined

- name: Configure periodic docker container prune
  when: docker_container_prune is defined
  block:
    - name: Install periodic docker container prune
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
      with_list:
        - files/docker-container-prune.service
        - files/docker-container-prune.timer
      register: docker_container_prune_install_result

    - name: Configure docker-container-prune.timer
      ansible.builtin.systemd_service:
        daemon_reload: "{{ docker_container_prune_install_result.changed | default(true) }}"
        name: docker-container-prune.timer
        state: "{{ 'started' if docker_container_prune else 'stopped' }}"
        enabled: "{{ docker_container_prune | bool }}"

- name: Configure periodic docker image prune
  when: docker_image_prune is defined
  block:
    - name: Install periodic docker image prune
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
      with_list:
        - files/docker-image-prune.service
        - files/docker-image-prune.timer
      register: docker_image_prune_install_result

    - name: Configure docker-image-prune.timer
      ansible.builtin.systemd_service:
        daemon_reload: "{{ docker_image_prune_install_result.changed | default(true) }}"
        name: docker-image-prune.timer
        state: "{{ 'started' if docker_image_prune else 'stopped' }}"
        enabled: "{{ docker_image_prune | bool }}"
